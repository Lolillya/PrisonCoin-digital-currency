version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5266:5266"
    volumes:
      - ./server:/app      # So code changes reflect in container
      - ~/.nuget/packages:/root/.nuget/packages:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    restart: unless-stopped
